<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, follow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meta Ads for Local Businesses – 12 Industries</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{--bg:#FAF7F0;--card:#FFFFFF;--tx:#0B1220;--mut:#4A5568;--gold:#7A5C14;--line:rgba(122,92,20,.35);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#141F37;--tx:#FFFFFF;--mut:#B8C2D0;--gold:#D4AF6A;--line:rgba(212,175,106,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#141F37;--tx:#FFFFFF;--mut:#B8C2D0;--gold:#D4AF6A;--line:rgba(212,175,106,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Montserrat',Arial,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
.brand{display:flex;align-items:center;gap:16px;font-size:13px;font-weight:600;letter-spacing:.3em;color:var(--gold)}
.brand i{flex:1;height:1px;background:var(--line)}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;line-height:1.02}
h1{font-size:clamp(44px,9vw,92px);margin-top:44px}
h1 em,h2 em{color:var(--gold);font-style:italic}
.lead{color:var(--mut);font-size:clamp(15px,2.4vw,18px);max-width:560px;margin:20px 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card img{display:block;width:100%;height:auto}
.card span{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:600;font-size:15px}
.card b{color:var(--gold);font-size:18px}
.back{display:inline-block;margin:36px 0 8px;font-size:14px;font-weight:600;letter-spacing:.12em;color:var(--gold);min-height:44px;line-height:44px}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;align-items:start;margin-top:12px}
.detail img{width:100%;max-width:440px;height:auto;border:1px solid var(--line);border-radius:10px;justify-self:center}
h2{font-size:clamp(38px,7vw,64px)}
.tag{margin:14px 0 6px;color:var(--gold);font-weight:600;letter-spacing:.14em;font-size:14px}
ul{list-style:none;padding:0;margin:24px 0}
li{padding:14px 0;border-bottom:1px solid var(--line);font-weight:500}
li:before{content:"\2713";color:var(--gold);margin-right:12px;font-weight:600}
.cta{display:inline-block;background:#D4AF6A;color:#0B1220;font-weight:600;letter-spacing:.1em;padding:16px 30px;border-radius:6px;min-height:48px}
.more{margin-top:56px}
.more p{font-size:13px;letter-spacing:.2em;color:var(--mut);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips a{border:1px solid var(--line);border-radius:30px;padding:10px 16px;font-size:14px;min-height:44px;display:flex;align-items:center}
.consult{margin-top:56px;border-top:1px solid var(--line);padding-top:30px}.consult h2{font-size:clamp(32px,5vw,48px)}
.consult form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:780px;margin-top:6px}
.consult label{display:block;font-size:13px;font-weight:600;color:var(--mut)}
.consult input,.consult select,.consult textarea{width:100%;margin-top:6px;padding:13px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--tx);font:inherit}
.consult .full{grid-column:1/-1}.consult .err{color:#e5484d;font-size:12px;display:block;min-height:1em}
button.cta{border:0;cursor:pointer;font:inherit;font-weight:600;letter-spacing:.1em}.cta.ghost{background:none;color:var(--tx);border:1px solid var(--line);margin:8px 0 0 10px}
.contact-line{margin-top:18px;color:var(--mut);font-size:14px}.contact-line a{color:var(--gold);text-decoration:underline}
footer{margin-top:56px;color:var(--mut);font-size:13px;border-top:1px solid var(--line);padding-top:20px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="../gh-lead.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
